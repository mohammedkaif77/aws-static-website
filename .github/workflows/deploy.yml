name: Deploy Static Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC repository:', payload.repository);
            console.log('OIDC ref:', payload.ref);
            console.log('OIDC event:', payload.event_name);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932103793095:role/GitHubActionsS3Deploy
          aws-region: us-east-1
          role-session-name: GitHubActionsSession

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://kaif-aws-static-website-2026 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete
