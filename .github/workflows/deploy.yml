name: Deploy Static Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check OIDC configuration
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"
          echo "OIDC URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+configured}"
          echo "OIDC Token: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+configured}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932103793095:role/GitHubActionsS3Deploy
          aws-region: us-east-1
          role-session-name: GitHubActionsSession

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://kaif-aws-static-website-2026 \
            --exclude ".git/*" \
            --exclude ".github/*"
